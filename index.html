    <style>
        body { 
            background: linear-gradient(135deg, #ff9ac1, #ff6b9d); 
            text-align: center; 
            font-family: Arial; 
            padding: 20px;
        }
        h1 { color: white; font-size: 36px; }
        img { 
            width: 250px; 
            height: 250px;
            border-radius: 50%; 
            border: 5px solid white; 
            margin: 20px 0;
        }
        p { color: white; font-size: 20px; font-weight: bold; }
/* PHOTO DANCE ANIMATION */
img {
  animation: dance 2s infinite;
}

@keyframes dance {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(-5deg) scale(1.05); }
  50% { transform: rotate(0deg) scale(1); }
  75% { transform: rotate(5deg) scale(1.05); }
  100% { transform: rotate(0deg) scale(1); }
}
    </style>
</head>
