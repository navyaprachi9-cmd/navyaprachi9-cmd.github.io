<!DOCTYPE html>
<html>
<head>
    <title>Navya Queen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: linear-gradient(135deg, #ff9ac1, #ff6b9d); 
            text-align: center; 
            font-family: Arial; 
            padding: 20px;
        }
        h1 { color: white; font-size: 36px; }
        img { 
            width: 250px; 
            height: 250px;
            border-radius: 50%; 
            border: 5px solid white; 
            margin: 20px 0;
        }
        p { color: white; font-size: 20px; font-weight: bold; }
/* PHOTO DANCE ANIMATION */
img {
  animation: dance 2s infinite;
}

@keyframes dance {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(-5deg) scale(1.05); }
  50% { transform: rotate(0deg) scale(1); }
  75% { transform: rotate(5deg) scale(1.05); }
  100% { transform: rotate(0deg) scale(1); }
}
button {
  background: black;
  color: white;
  border: 2px solid hotpink;
  padding: 10px 20px;
  margin: 5px;
  border-radius: 20px;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: hotpink;
  transform: scale(1.1);
}
    </style>
</head>
<body>
<h1 id="typewriter"></h1>
<p id="clock"></p>
<p>Welcome to my website ✨</p>
<img src="https://raw.githubusercontent.com/navyaprachi9-cmd/Navya-queen-ki-website/main/navya.jpg"> alt="Navya Queen">
<br>
<button onclick="document.body.style.background = 'hotpink'">Gulaabi Karo 💖</button>
<button onclick="document.body.style.background = 'skyblue'">Neela Karo 💙</button>
<button onclick="startConfetti()">Party Karo 🎉</button>
<audio autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
</audio>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script>
let i = 0;
let txt = '👑 Navya Queen 👑';
function typeWriter() {
  if (i < txt.length) {
    document.getElementById("typewriter").innerHTML += txt.charAt(i);
    i++;
    setTimeout(typeWriter, 150);
  }
}
typeWriter();

function showTime(){
  document.getElementById('clock').innerHTML = new Date().toLocaleTimeString();
  setTimeout(showTime, 1000);
}
showTime();

function startConfetti() {
  confetti({
    particleCount: 150,
    spread: 100,
    origin: { y: 0.6 }
  });
}
</script>
</body>
